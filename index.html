<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TeekTeek" />
  <title>TeekTeek</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-primary: #000000;
      --bg-card: #161618;
      --bg-elevated: #212124;
      --accent: #ff3b30;
      --accent-soft: rgba(255, 59, 48, 0.18);
      --accent-glow: rgba(255, 59, 48, 0.38);
      --heat-0: #262629;
      --heat-1: #fde2e1;
      --heat-2: #f89892;
      --heat-3: #ef5349;
      --heat-4: #ff3b30;
    }

    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro Rounded", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overscroll-behavior-y: none;
      letter-spacing: -0.015em;
    }

    .sf-rounded {
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .ios-glass {
      background: rgba(18, 18, 20, 0.82);
      backdrop-filter: saturate(180%) blur(25px);
      -webkit-backdrop-filter: saturate(180%) blur(25px);
    }

    .card-surface {
      background-color: var(--bg-card);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.055);
    }

    .elevated-surface {
      background-color: var(--bg-elevated);
    }

    .accent-bg { background-color: var(--accent); }
    .accent-text { color: var(--accent); }
    .accent-border { border-color: var(--accent); }
    .accent-soft-bg { background-color: var(--accent-soft); }

    /* Apple Premium Tactile Start Button */
    .apple-start-btn {
      background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 100%), var(--accent);
      box-shadow: 0 10px 28px -6px var(--accent-glow), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .apple-start-btn:active {
      transform: scale(0.96);
      filter: brightness(0.92);
    }

    .apple-secondary-btn {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .apple-secondary-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.14);
    }

    /* Non-scrolling 25-column Year Grid */
    .year-grid-matrix {
      display: grid;
      grid-template-columns: repeat(25, minmax(0, 1fr));
      gap: 3px;
      width: 100%;
    }
    .year-grid-cell {
      aspect-ratio: 1 / 1;
      border-radius: 2.5px;
      width: 100%;
    }

    .heat-0 { background-color: var(--heat-0); }
    .heat-1 { background-color: var(--heat-1); }
    .heat-2 { background-color: var(--heat-2); }
    .heat-3 { background-color: var(--heat-3); }
    .heat-4 { background-color: var(--heat-4); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-28">

  <!-- TOP APPLE HEADER -->
  <header class="sticky top-0 z-30 ios-glass border-b border-white/[0.07] px-5 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-full accent-bg flex items-center justify-center shadow-sm">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z" />
        </svg>
      </div>
      <h1 id="headerTitle" class="text-[19px] font-bold tracking-tight text-white">TeekTeek</h1>
    </div>

    <div class="flex items-center gap-2">
      <button id="ambientBtn" type="button" class="px-3 py-1.5 rounded-full apple-secondary-btn text-xs font-medium text-gray-300 flex items-center gap-1.5 cursor-pointer">
        <span class="text-xs">🌧️</span>
        <span id="ambientText" class="text-[11px] font-semibold">Sound</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-md w-full mx-auto px-4 pt-4">

    <!-- ================= TAB 1: FOCUS TIMER VIEW ================= -->
    <section id="view-timer" class="space-y-6">

      <!-- Apple Segmented Mode Control -->
      <div class="card-surface p-1 rounded-full flex max-w-[260px] mx-auto">
        <button id="modePomoBtn" type="button" class="flex-1 py-1.5 text-xs font-semibold rounded-full elevated-surface text-white shadow-sm transition cursor-pointer">
          Pomodoro
        </button>
        <button id="modeStopBtn" type="button" class="flex-1 py-1.5 text-xs font-semibold rounded-full text-gray-400 hover:text-white transition cursor-pointer">
          Stopwatch
        </button>
      </div>

      <!-- Task / Tag Selector Pill -->
      <div class="flex flex-col items-center">
        <button id="openTaskBtn" type="button" class="px-4 py-1.5 rounded-full card-surface flex items-center gap-2 text-xs font-semibold text-gray-200 hover:bg-white/[0.04] transition cursor-pointer">
          <span id="activeTaskDot" class="w-2 h-2 rounded-full accent-bg"></span>
          <span id="activeTaskLabel">Deep Work</span>
          <svg class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M19 9l-7 7-7-7"/></svg>
        </button>
      </div>

      <!-- Apple Watch Ultra / Fitness Inspired Circular Dial -->
      <div class="relative w-72 h-72 mx-auto flex items-center justify-center">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 260 260">
          <!-- Subtle Tick Marks Ring -->
          <circle cx="130" cy="130" r="114" stroke="rgba(255,255,255,0.06)" stroke-width="12" fill="none" />
          <circle id="timerRing" cx="130" cy="130" r="114" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" fill="none"
            stroke-dasharray="716.28" stroke-dashoffset="0" class="transition-all duration-300" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <span id="phaseBadge" class="px-3 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-widest accent-soft-bg accent-text mb-2">
            FOCUS
          </span>
          <div id="timeDisplay" class="sf-rounded text-[58px] leading-none font-bold tracking-tight tabular-nums text-white">
            25:00
          </div>
          <p id="subStatusText" class="text-xs font-medium text-gray-500 mt-2.5">25 min goal</p>
        </div>
      </div>

      <!-- Pomodoro Duration Quick Presets -->
      <div id="pomoPresets" class="flex justify-center gap-2">
        <button type="button" data-mins="25" class="pomo-preset px-3.5 py-1.5 rounded-full card-surface border accent-border text-xs font-semibold text-white transition cursor-pointer">25m</button>
        <button type="button" data-mins="45" class="pomo-preset px-3.5 py-1.5 rounded-full card-surface text-xs font-semibold text-gray-400 transition cursor-pointer">45m</button>
        <button type="button" data-mins="60" class="pomo-preset px-3.5 py-1.5 rounded-full card-surface text-xs font-semibold text-gray-400 transition cursor-pointer">60m</button>
        <button type="button" data-mins="90" class="pomo-preset px-3.5 py-1.5 rounded-full card-surface text-xs font-semibold text-gray-400 transition cursor-pointer">90m</button>
      </div>

      <!-- Redesigned Apple Tactile Pill Controls -->
      <div class="flex items-center justify-center gap-3.5 pt-2">
        <button id="lapBtn" type="button" class="hidden w-14 h-14 rounded-full apple-secondary-btn text-gray-200 font-semibold text-xs flex items-center justify-center cursor-pointer">
          Lap
        </button>

        <button id="mainActionBtn" type="button" class="h-14 px-10 rounded-full apple-start-btn text-white font-bold text-[16px] tracking-wide flex items-center justify-center gap-2.5 cursor-pointer min-w-[180px]">
          <svg id="mainActionIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M8 5.14v14l11-7-11-7z" />
          </svg>
          <span id="mainActionText">Start Focus</span>
        </button>

        <button id="finishBtn" type="button" class="hidden w-14 h-14 rounded-full apple-secondary-btn text-gray-200 hover:text-red-400 font-semibold text-xs flex items-center justify-center cursor-pointer" title="Finish & Save">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <rect x="6" y="6" width="12" height="12" rx="2" />
          </svg>
        </button>
      </div>

      <!-- Stopwatch Laps Container -->
      <div id="lapsContainer" class="hidden card-surface p-3.5 max-h-36 overflow-y-auto space-y-1.5">
        <div class="text-[10px] font-bold uppercase tracking-wider text-gray-500 px-1">Lap Splits</div>
        <div id="lapsList" class="space-y-1 text-xs"></div>
      </div>

      <!-- Today's Summary Pill Card -->
      <div class="card-surface p-4 flex items-center justify-between">
        <div>
          <p class="text-[11px] text-gray-400 font-medium">Today's Focus</p>
          <div id="miniTodayHours" class="text-xl font-bold text-white mt-0.5">0<span class="text-xs font-normal text-gray-400 ml-0.5">h</span> 0<span class="text-xs font-normal text-gray-400 ml-0.5">m</span></div>
        </div>
        <div class="text-right">
          <p class="text-[11px] text-gray-400 font-medium">Today's Pomos</p>
          <div id="miniTodayPomos" class="text-xl font-bold accent-text mt-0.5">0</div>
        </div>
      </div>
    </section>


    <!-- ================= TAB 2: FOCUS STATISTICS (EXACT REFERENCE MATCH) ================= -->
    <section id="view-stats" class="hidden space-y-3.5 pb-8">

      <!-- 1. TOP 4 SUMMARY CARDS (2x2 Grid) -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Today's Pomo -->
        <div class="card-surface p-4">
          <div class="text-[13px] font-semibold text-white">Today's Pomo</div>
          <div class="text-[11px] text-gray-500 mt-0.5">
            <span id="pomoYesterdayDelta">0 from yesterday</span>
            <span class="text-emerald-400 font-bold ml-0.5">↑</span>
          </div>
          <div id="statTodayPomos" class="sf-rounded text-3xl font-bold accent-text mt-2">0</div>
        </div>

        <!-- Today's Focus (h) -->
        <div class="card-surface p-4">
          <div class="text-[13px] font-semibold text-white">Today's Focus (h)</div>
          <div class="text-[11px] text-gray-500 mt-0.5">
            <span id="focusYesterdayDelta">0h0m from yesterday</span>
            <span class="text-emerald-400 font-bold ml-0.5">↑</span>
          </div>
          <div id="statTodayDuration" class="sf-rounded text-3xl font-bold accent-text mt-2">
            0<span class="text-sm font-medium ml-0.5">h</span> 0<span class="text-sm font-medium ml-0.5">m</span>
          </div>
        </div>

        <!-- Total Pomos -->
        <div class="card-surface p-4">
          <div class="text-[13px] font-semibold text-white">Total Pomos</div>
